<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер ЦТ по математике</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
            padding-bottom: 80px; /* Место для нижнего меню */
        }
        h2 { font-size: 20px; margin-bottom: 20px; }
        
        /* Стили главного экрана (список ДЗ) */
        .card {
            background: white; border-radius: 12px; padding: 15px;
            margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center;
        }
        .card-info { display: flex; align-items: center; gap: 12px; }
        .card-icon { font-size: 24px; background: #eef2f7; padding: 10px; border-radius: 50%; }
        .card-title { font-weight: bold; font-size: 16px; margin-bottom: 4px; }
        .card-subtitle { font-size: 12px; color: #777; }
        .btn-start { background-color: #3182ce; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; }

        /* ЭКРАН ТЕСТА (Изначально скрыт) */
        .screen { display: none; }
        .screen.active { display: block; }
        
        .math-task {
            background: white; border-radius: 12px; padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px;
        }
        .task-header { font-size: 14px; color: #777; margin-bottom: 10px; font-weight: bold; }
        .task-text { font-size: 18px; line-height: 1.5; margin-bottom: 20px; }
        
        /* Стили для части А (варианты ответов) */
        .options-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .option-btn {
            background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 10px;
            padding: 12px; text-align: left; font-size: 16px; cursor: pointer; transition: 0.2s;
        }
        .option-btn:hover { border-color: #3182ce; background: #ebf8ff; }
        .option-btn.selected { border-color: #3182ce; background: #3182ce; color: white; }

        /* Кнопки управления тестом */
        .btn-action {
            width: 100%; background-color: #48bb78; color: white; border: none;
            padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .btn-back {
            background-color: #e2e8f0; color: #4a5568; margin-top: 10px;
        }

        /* Результат проверки */
        .result-message {
            margin-top: 15px; padding: 12px; border-radius: 8px; display: none; font-weight: bold; text-align: center;
        }
        .result-message.correct { display: block; background: #c6f6d5; color: #22543d; }
        .result-message.wrong { display: block; background: #fed7d7; color: #742a2a; }

        /* Нижнее меню навигации */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; display: flex; justify-content: space-around;
            padding: 10px 0; border-top: 1px solid #eee; z-index: 100;
        }
        .nav-item { text-align: center; font-size: 11px; color: #777; text-decoration: none; }
        .nav-item.active { color: #3182ce; font-weight: bold; }
        .nav-icon { display: block; font-size: 20px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: СПИСОК ЗАДАНИЙ -->
    <div id="screen-main" class="screen active">
        <h2>Мои домашние задания</h2>
        <div class="card">
            <div class="card-info">
                <div class="card-icon">🎲</div>
                <div>
                    <div class="card-title">ДЗ 1. Линейные уравнения</div>
                    <div class="card-subtitle">Математика • Часть А</div>
                </div>
            </div>
            <button class="btn-start" onclick="showScreen('screen-test')">Начать</button>
        </div>
    </div>

    <!-- ЭКРАН 2: САМ ТЕСТ (ЧАСТЬ А) -->
    <div id="screen-test" class="screen">
        <h2>Прохождение ДЗ</h2>
        <div class="math-task">
            <div class="task-header">Задание А1</div>
            <div class="task-text">
                Найдите корень уравнения:<br>
                <b>3x - 7 = 5</b>
            </div>
            
            <!-- Варианты ответов (ЦТ стиль) -->
            <div class="options-container">
                <button class="option-btn" onclick="selectOption(this, 1)">1)  x = 2</button>
                <button class="option-btn" onclick="selectOption(this, 2)">2)  x = -4</button>
                <button class="option-btn" onclick="selectOption(this, 3)">3)  x = 4</button>
                <button class="option-btn" onclick="selectOption(this, 4)">4)  x = 0</button>
            </div>

            <button class="btn-action" onclick="checkAnswer()">Проверить ответ</button>
            <div id="result" class="result-message"></div>
            
            <button class="btn-action btn-back" onclick="showScreen('screen-main')">Назад к списку</button>
        </div>
    </div>

    <!-- МЕНЮ НАВИГАЦИИ -->
    <div class="nav-bar">
        <a href="#" class="nav-item active"><span class="nav-icon">📅</span>Задания</a>
        <a href="#" class="nav-item"><span class="nav-icon">💬</span>Чаты</a>
        <a href="#" class="nav-item"><span class="nav-icon">📈</span>Статистика</a>
        <a href="#" class="nav-item"><span class="nav-icon">👤</span>Профиль</a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let selectedAnswer = null;
        const correctAnswer = 3; // Правильный ответ: 3) x = 4

        // Функция переключения экранов
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classWith = 'screen active';
            // Сбрасываем старые результаты при переходе
            selectedAnswer = null;
            document.getElementById('result').className = 'result-message';
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        }

        // Выбор варианта ответа
        function selectOption(element, optionIndex) {
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            element.classList.add('selected');
            selectedAnswer = optionIndex;
        }

        // Проверка ответа
        function checkAnswer() {
            const resultDiv = document.getElementById('result');
            if (selectedAnswer === null) {
                alert("Пожалуйста, выберите вариант ответа!");
                return;
            }

            if (selectedAnswer === correctAnswer) {
                resultDiv.innerText = "🎉 Правильно! Отличный результат.";
                resultDiv.className = "result-message correct";
            } else {
                resultDiv.innerText = "❌ Неверно. Попробуй еще раз или посмотри теорию.";
                resultDiv.className = "result-message wrong";
            }
        }
    </script>
</body>
</html>
